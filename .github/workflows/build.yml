# .github/workflows/build.yml

name: Build Server-Mode EXE from Makefile

on:
  workflow_dispatch:
  push:
    branches:
      - 'core_fix_mp'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 步骤 1：检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: 'core_fix_mp'

    # 步骤 2：设置 MSYS2/MinGW64 编译环境
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          git
          mingw-w64-x86_64-gcc

    # 步骤 3：修补源代码以解决编译错误 (核心修正)
    - name: Patch libev source code
      shell: bash
      run: |
        # 这是解决问题的关键。我们使用 sed 命令来修复 libev/ev_win32.c 文件中的类型转换错误。
        # 我们将 `SOCKET sock[2] = { -1, -1 };` 替换为 `SOCKET sock[2] = { (SOCKET)-1, (SOCKET)-1 };`
        # 这通过显式类型转换，满足了编译器的严格检查要求。
        sed -i "s/SOCKET sock\[2\] = { -1, -1 };/SOCKET sock[2] = { (SOCKET)-1, (SOCKET)-1 };/" libev/ev_win32.c
        echo "Patched libev/ev_win32.c to fix narrowing conversion error."

    # 步骤 4：使用 Makefile 编译 (服务器模式)
    - name: Build with Makefile (Server Mode)
      shell: msys2 {0}
      run: |
        # 使用修正后的代码进行编译
        make cygwin mode=1 -j4

    # 步骤 5：上传编译好的可执行文件
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-x64-server-only
        path: udp2raw.exe
        if-no-files-found: error
