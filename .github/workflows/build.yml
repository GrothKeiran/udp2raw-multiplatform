# .github/workflows/build.yml

name: Build Server-Mode EXE from Makefile

on:
  workflow_dispatch:
  push:
    branches:
      - 'core_fix_mp'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 步骤 1：检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: 'core_fix_mp'

    # 步骤 2：设置 MSYS2/MinGW64 编译环境
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          mingw-w64-x86_64-gcc

    # 步骤 3：使用 Makefile 编译
    - name: Build with Makefile (Server Mode)
      shell: msys2 {0}
      run: |
        # 运行 make 命令，只编译服务器模式
        make mode=1 -j4

    # 步骤 4：侦察并上传产物 (核心修正)
    - name: Find and Upload Artifact
      shell: bash
      run: |
        # 编译完成后，列出当前目录的所有文件，让我们在日志中看到真实的文件名
        echo "Listing files in current directory to find the executable:"
        ls -l *.exe

        # 找到那个 .exe 文件并上传
        # 使用通配符 *.exe 来自动匹配生成的可执行文件，无论它叫什么名字
        # 这是最稳健、最不可能出错的方法
        ARTIFACT_PATH=$(find . -maxdepth 1 -name "*.exe" -print -quit)
        echo "Found artifact at: $ARTIFACT_PATH"
        # 将文件名写入 GitHub Actions 的环境变量，供下一步使用
        echo "ARTIFACT_NAME=${ARTIFACT_PATH##*/}" >> $GITHUB_ENV

    - name: Upload the executable
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-x64-server-only
        # 从上一步的环境变量中读取正确的文件名
        path: ${{ env.ARTIFACT_NAME }}
        if-no-files-found: error
