# .github/workflows/build.yml

name: Build Server-Mode EXE from Makefile

on:
  workflow_dispatch:
  push:
    branches:
      - 'core_fix_mp'

jobs:
  build-and-upload:
    runs-on: windows-latest

    steps:
    # 步骤 1：检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: 'core_fix_mp'

    # 步骤 2：设置 MSYS2/MinGW64 编译环境
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          mingw-w64-x86_64-gcc

    # 步骤 3：编译、侦察并上传 (所有操作在一步内完成)
    - name: Build, Find, and Upload
      shell: msys2 {0}
      run: |
        # 1. 运行 make 命令，并把所有输出（包括标准输出和标准错误）都重定向到日志文件，以便分析
        make mode=1 -j4 > build.log 2>&1 || (cat build.log && exit 1)
        
        # 2. 如果 make 命令成功（没有退出），我们才继续往下走
        echo "Make command completed. Listing current directory contents:"
        ls -l
        
        # 3. 找到生成的 .exe 文件
        ARTIFACT_PATH=$(find . -maxdepth 1 -name "*.exe" -print -quit)
        
        # 4. 检查是否真的找到了文件
        if [ -z "$ARTIFACT_PATH" ]; then
          echo "Error: No .exe file found after build."
          echo "Displaying build log:"
          cat build.log
          exit 1
        fi
        
        # 5. 如果找到了，就准备上传
        echo "Found artifact: $ARTIFACT_PATH"
        echo "ARTIFACT_NAME=${ARTIFACT_PATH##*/}" >> $GITHUB_ENV

    # 步骤 4：上传产物
    - name: Upload the executable
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-x64-server-only
        path: ${{ env.ARTIFACT_NAME }}
        if-no-files-found: error
