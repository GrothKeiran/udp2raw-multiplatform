# .github/workflows/build.yml

name: Build Server-Mode EXE from Makefile

on:
  workflow_dispatch:
  push:
    branches:
      - 'core_fix_mp'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 步骤 1：检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: 'core_fix_mp'

    # 步骤 2：设置 MSYS2/MinGW64 编译环境
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        # 核心修正 1：在安装列表中加入 git
        install: >-
          make
          git
          mingw-w64-x86_64-gcc

    # 步骤 3：使用 Makefile 编译 (服务器模式)
    - name: Build with Makefile (Server Mode)
      shell: msys2 {0}
      run: |
        # 核心修正 2：使用 Makefile 中指定的正确命令 `make cygwin`
        # 并通过 mode=1 参数来构建纯服务器模式
        make cygwin mode=1 -j4

    # 步骤 4：上传编译好的可执行文件
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-x64-server-only
        # 根据 Makefile 的规则，cygwin 目标生成的可执行文件名是 udp2raw.exe
        path: udp2raw.exe
        if-no-files-found: error
