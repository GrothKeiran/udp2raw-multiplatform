# .github/workflows/build.yml

# 工作流程名称
name: Build Server-Mode EXE from Makefile

# 触发条件
on:
  workflow_dispatch:
  push:
    branches:
      - 'core_fix_mp'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 步骤 1：检出您的代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: 'core_fix_mp'

    # 步骤 2：设置 MSYS2/MinGW64 编译环境
    # 我们依然需要这个环境，因为它提供了 make 和 g++ 编译器
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          mingw-w64-x86_64-gcc

    # 步骤 3：使用 Makefile 编译 (服务器模式)
    # 这是最核心的、完全重写的步骤
    - name: Build with Makefile (Server Mode)
      shell: msys2 {0}
      run: |
        # 事实证明，checkout之后我们就在项目的根目录。
        # 这个目录里有 Makefile 文件。
        
        # 直接运行 make 命令，并传入 mode=1 参数。
        # 这会告诉 Makefile 只编译服务器模式。
        # -j4 参数可以利用多核心进行并行编译，速度更快。
        make mode=1 -j4

    # 步骤 4：上传编译好的可执行文件
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-x64-server-only
        # 根据 Makefile，生成的文件名为 udp2raw_mp_nolib.exe
        path: udp2raw_mp_nolib.exe
        if-no-files-found: error
